<svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- dark rounded-square badge -->
  <rect x="10" y="10" width="300" height="300" rx="56" fill="#0E1116"/>

  <g transform="translate(38,108)">
    <!-- BUS BODY: long rounded rectangle, classic side-profile proportions -->
    <path d="M 14,0
             H 210
             Q 244,0 244,34
             V 78
             H 0
             V 34
             Q 0,0 14,0
             Z"
          fill="#D6FF3F"/>

    <!-- flat ground/bumper line under the body -->
    <rect x="-6" y="78" width="256" height="10" rx="5" fill="#D6FF3F"/>

    <!-- windshield + side windows, punched out as one row (clearly bus-like strip of glass) -->
    <rect x="14" y="14" width="216" height="26" rx="6" fill="#0E1116"/>
    <!-- window dividers -->
    <rect x="58" y="14" width="6" height="26" fill="#D6FF3F"/>
    <rect x="102" y="14" width="6" height="26" fill="#D6FF3F"/>
    <rect x="146" y="14" width="6" height="26" fill="#D6FF3F"/>
    <rect x="190" y="14" width="6" height="26" fill="#D6FF3F"/>

    <!-- destination sign box up top -->
    <rect x="24" y="2" width="60" height="10" rx="3" fill="#0E1116"/>

    <!-- door -->
    <rect x="14" y="48" width="14" height="30" fill="#0E1116"/>

    <!-- front headlight -->
    <circle cx="228" cy="60" r="7" fill="#0E1116"/>

    <!-- wheels, clearly protruding below the body line -->
    <circle cx="52" cy="90" r="26" fill="#0E1116"/>
    <circle cx="52" cy="90" r="26" fill="none" stroke="#D6FF3F" stroke-width="9"/>
    <circle cx="52" cy="90" r="7" fill="#D6FF3F"/>

    <circle cx="192" cy="90" r="26" fill="#0E1116"/>
    <circle cx="192" cy="90" r="26" fill="none" stroke="#D6FF3F" stroke-width="9"/>
    <circle cx="192" cy="90" r="7" fill="#D6FF3F"/>
  </g>
</svg>
